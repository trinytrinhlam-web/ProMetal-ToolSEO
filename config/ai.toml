# Mô hình AI cho từng việc. Sửa file này rồi tải lại trang là có hiệu lực, không cần sửa code.
# Không có hãng mặc định: mỗi việc ghi rõ dùng hãng nào, và hãng đó phải có khóa trong
# Cài đặt → 🔌 Kết nối. Muốn chọn mô hình nào thì thử mù ở Cài đặt → 🤖 Mô hình AI.
#
# provider   : hãng AI, một trong ba giá trị:
#                "anthropic" (Claude), "openai" (ChatGPT), "gemini" (Google Gemini).
# model      : tên mô hình của hãng đó, ghi đúng theo tài liệu của hãng. Ví dụ đang dùng
#              hoặc đã thử trong app:
#                anthropic: "claude-opus-5-5", "claude-sonnet-5-5"
#                openai   : "gpt-5.1"
#                gemini   : "gemini-3-pro"
#              Tên sai thì app báo "Không có mô hình ...".
#              Việc tạo ảnh ([tasks.image]) dùng mô hình tạo ảnh riêng, xem ghi chú ở mục đó.
#              Claude KHÔNG tạo được ảnh: việc tạo ảnh chỉ chọn "openai" hoặc "gemini".
# effort     : AI nghĩ kỹ tới đâu: "low" | "medium" | "high" | "xhigh" | "max".
#              Càng cao càng kỹ, nhưng chậm hơn và tốn tiền hơn.
#                anthropic, openai: dùng đúng mức bạn ghi.
#                gemini: chỉ có 3 mức low / medium / high; "xhigh" và "max" được tính là "high".
#              Mô hình không có chế độ suy nghĩ thì app tự bỏ qua effort (OpenAI, Gemini).
# web_search : true = cho AI tự tìm trên web (dùng cho bước nghiên cứu đối thủ). Cả 3 hãng
#              đều hỗ trợ.
# max_tokens : độ dài tối đa AI được trả về (1 token ≈ 1 chữ tiếng Việt ngắn).
#              Báo "Bài dài quá giới hạn" thì tăng số này.
#
# Thử mù (Cài đặt → 🤖 Mô hình AI) KHÔNG đọc và KHÔNG ghi file này, và không có mục
# [tasks.blind_test] ở đây: hãng, mô hình, effort do bạn chọn trên màn hình, độ dài bài thử
# cố định trong app. Thử mù xong, bạn tự sửa provider / model / effort của việc cần đổi ở dưới.
# Ví dụ đổi việc viết bài sang ChatGPT: trong [tasks.write] ghi provider = "openai" và
# model = "gpt-5.1".
#
# Việc đang có: research, outline, write, rewrite, review, meta, links (bài viết); alt (viết chữ
# thay thế cho ảnh); image (tạo ảnh minh họa, đang tắt, xem ghi chú ở cuối file).

[tasks.research]  # ý định tìm kiếm + đọc các bài đứng đầu Google
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
web_search = true
max_tokens = 16000

[tasks.outline]  # tạo dàn ý
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 8000

[tasks.write]  # viết toàn bài
provider = "anthropic"
model = "claude-opus-5-5"
effort = "high"
max_tokens = 32000

[tasks.rewrite]  # viết lại một phần theo yêu cầu
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 8000

[tasks.review]  # rà soát văn phong theo checklist
provider = "anthropic"
model = "claude-opus-5-5"
effort = "medium"
max_tokens = 16000

[tasks.meta]  # gợi ý meta title, meta description (bước SEO)
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"
max_tokens = 2000

[tasks.links]  # gợi ý chỗ đặt liên kết nội bộ tới bài đã đăng (bước SEO)
# KHÔNG thêm web_search ở việc này: lời dặn có tiêu đề bài lấy từ website (điều kiện Lá Chắn
# T-039). Có web_search thì phần mềm từ chối chạy việc này.
provider = "anthropic"
model = "claude-opus-5-5"
effort = "low"
max_tokens = 2000

[tasks.alt]  # viết alt (chữ thay thế) và chú thích cho ảnh, AI nhìn ảnh rồi viết
# Quyết định 4A (2026-10-19): Claude Sonnet. Quy tắc viết alt nằm ở mục [alt] của
# config/content.toml. Việc ngắn (alt ≤ 125 ký tự) nên effort thấp, max_tokens nhỏ.
provider = "anthropic"
model = "claude-sonnet-5-5"
effort = "low"
max_tokens = 2000

# ---------------------------------------------------------------- tạo ảnh minh họa (đang tắt)
# Quyết định 4A (2026-10-19): tạo ảnh bằng Gemini. Mục dưới đây ĐANG TẮT (có dấu # ở đầu dòng)
# vì phần mềm chưa có chức năng tạo ảnh (phiếu T-053). Nếu bật sớm, trang Soạn bài sẽ đòi khóa
# Gemini ngay cả khi bạn chỉ viết bài. Đợi Chỉ Huy báo chức năng tạo ảnh đã xong rồi mới xóa
# dấu # ở 4 dòng [tasks.image], provider, model, max_tokens.
#
# Tên mô hình theo báo cáo T-046 (đọc tài liệu Google ngày 2026-10-17), CHƯA XÁC MINH bằng lệnh
# gọi thật. Các mô hình tạo ảnh của Gemini (giá ước tính mỗi ảnh, chưa xác minh):
#   "gemini-nano-banana-2.1"      khoảng 0,034 USD (cỡ 1K) / 0,050 USD (cỡ 2K)  ← đang chọn
#   "gemini-3.1-flash-lite-image" khoảng 0,034 USD
#   "gemini-3.1-flash-image"      khoảng 0,067 / 0,101 USD
#   "gemini-3-pro-image"          khoảng 0,134 USD
# Muốn dùng OpenAI: provider = "openai", model = "gpt-image-2" (khoảng 0,053 USD/ảnh chất
# lượng vừa, chưa xác minh). effort và web_search không dùng cho việc tạo ảnh.
#
# [tasks.image]  # tạo ảnh minh họa từ prompt (ảnh AI luôn ghi rõ là ảnh minh họa)
# provider = "gemini"
# model = "gemini-nano-banana-2.1"
# max_tokens = 2000
