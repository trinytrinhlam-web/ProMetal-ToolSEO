# Mô hình AI cho từng việc. Sửa file này rồi tải lại trang là có hiệu lực, không cần sửa code.
# Không có hãng mặc định: mỗi việc ghi rõ dùng hãng nào, và hãng đó phải có khóa trong
# Cài đặt → 🔌 Kết nối. Muốn chọn mô hình nào thì thử mù ở Cài đặt → 🤖 Mô hình AI.
#
# provider   : hãng AI, một trong ba giá trị:
#                "anthropic" (Claude), "openai" (ChatGPT), "gemini" (Google Gemini).
# model      : tên mô hình của hãng đó, ghi đúng theo tài liệu của hãng. Ví dụ đang dùng
#              hoặc đã thử trong app:
#                anthropic: "claude-opus-5-5", "claude-sonnet-5-5"
#                openai   : "gpt-5.1"
#                gemini   : "gemini-3.8-flash" (gói miễn phí dùng được, 18/11),
#                           "gemini-3.1-pro-preview" (phải bật thanh toán Gemini)
#              Tên sai thì app báo "Không có mô hình ...".
#              Việc tạo ảnh ([tasks.image]) dùng hãng, mô hình tạo ảnh riêng (Cloudflare), xem
#              ghi chú ở mục đó. Claude KHÔNG tạo được ảnh.
# effort     : AI nghĩ kỹ tới đâu: "low" | "medium" | "high" | "xhigh" | "max".
#              Càng cao càng kỹ, nhưng chậm hơn và tốn tiền hơn.
#                anthropic, openai: dùng đúng mức bạn ghi.
#                gemini: chỉ có 3 mức low / medium / high; "xhigh" và "max" được tính là "high".
#              Mô hình không có chế độ suy nghĩ thì app tự bỏ qua effort (OpenAI, Gemini).
# web_search : true = cho AI tự tìm trên web (dùng cho bước nghiên cứu đối thủ). Cả 3 hãng
#              đều hỗ trợ.
# max_tokens : độ dài tối đa AI được trả về (1 token ≈ 1 chữ tiếng Việt ngắn).
#              Báo "Bài dài quá giới hạn" thì tăng số này.
#
# Thử mù (Cài đặt → 🤖 Mô hình AI) KHÔNG đọc và KHÔNG ghi file này, và không có mục
# [tasks.blind_test] ở đây: hãng, mô hình, effort do bạn chọn trên màn hình, độ dài bài thử
# cố định trong app. Thử mù xong, bạn tự sửa provider / model / effort của việc cần đổi ở dưới.
# Ví dụ đổi việc viết bài sang ChatGPT: trong [tasks.write] ghi provider = "openai" và
# model = "gpt-5.1".
#
# Việc đang có: research, outline, write, rewrite, review, meta, links (bài viết); plan (đọc ghi
# chú kế hoạch ở trang Kế hoạch); alt (viết chữ thay thế cho ảnh); image_prompt (viết prompt tiếng
# Anh, alt, chú thích cho mọi chỗ ảnh của bài ở chế độ tự động); image (tạo ảnh minh họa bằng
# Cloudflare, đang tắt, xem ghi chú ở cuối file).

# Chủ dự án chốt 2026-11-18: TẠM dùng Gemini Flash miễn phí cho mọi việc (máy chưa có khóa Claude;
# khóa Gemini chưa bật thanh toán nên mô hình Pro và tìm Google bị từ chối). Muốn quay
# lại Claude: ở từng việc ghi provider = "anthropic", model = "claude-opus-5-5" (việc alt:
# "claude-sonnet-5-5"); ở việc research ngay dưới đây đổi lại web_search = true để AI tìm
# Google như trước; rồi nhập khóa Claude ở Cài đặt → 🔌 Kết nối.

[tasks.research]  # ý định tìm kiếm + đọc các bài đứng đầu Google (đang tắt tìm web từ 18/11)
provider = "gemini"
model = "gemini-3.8-flash"
effort = "medium"
web_search = false  # gói Gemini miễn phí: tìm Google hết hạn mức (18/11)
max_tokens = 16000

[tasks.outline]  # tạo dàn ý
provider = "gemini"
model = "gemini-3.8-flash"
effort = "medium"
max_tokens = 8000

[tasks.write]  # viết toàn bài
provider = "gemini"
model = "gemini-3.8-flash"
effort = "high"
max_tokens = 32000

[tasks.rewrite]  # viết lại một phần theo yêu cầu
provider = "gemini"
model = "gemini-3.8-flash"
effort = "medium"
max_tokens = 8000

[tasks.review]  # rà soát văn phong theo checklist
provider = "gemini"
model = "gemini-3.8-flash"
effort = "medium"
max_tokens = 16000

[tasks.meta]  # gợi ý meta title, meta description (bước SEO)
provider = "gemini"
model = "gemini-3.8-flash"
effort = "low"
max_tokens = 2000

[tasks.links]  # gợi ý chỗ đặt liên kết nội bộ tới bài đã đăng (bước SEO)
# KHÔNG thêm web_search ở việc này: lời dặn có tiêu đề bài lấy từ website (điều kiện Lá Chắn
# T-039). Có web_search thì phần mềm từ chối chạy việc này.
provider = "gemini"
model = "gemini-3.8-flash"
effort = "low"
max_tokens = 2000

[tasks.plan]  # đọc ghi chú kế hoạch bạn dán ở trang Kế hoạch, đề xuất thêm, sửa, bỏ bài
# Thiết kế Giai đoạn 5 (T-094): cùng hãng, mô hình, effort với việc lập dàn ý ([tasks.outline])
# cho tới khi bạn muốn đổi. Một lần đọc có thể ra tới 100 đề xuất nên max_tokens lớn hơn dàn ý.
# KHÔNG thêm web_search ở việc này: lời dặn chứa kế hoạch và ghi chú chép từ nơi khác (điều kiện
# Lá Chắn T-094). Dù có ghi, phần mềm vẫn luôn tắt tìm web cho việc này.
provider = "gemini"
model = "gemini-3.8-flash"
effort = "medium"
max_tokens = 16000

[tasks.alt]  # viết alt (chữ thay thế) và chú thích cho ảnh, AI nhìn ảnh rồi viết
# Quyết định 4A (2026-10-19): Claude Sonnet. Tạm Gemini Flash khóa miễn phí từ 2026-11-18: chủ
# dự án chấp nhận việc Google có thể dùng ảnh gửi lên (sổ rủi ro docs/team/security.md mục 6).
# Quy tắc viết alt nằm ở mục [alt] của config/content.toml. Việc ngắn (alt ≤ 125 ký tự) nên
# effort thấp, max_tokens nhỏ.
provider = "gemini"
model = "gemini-3.8-flash"
effort = "low"
max_tokens = 2000

[tasks.image_prompt]  # viết chữ cho mọi chỗ ảnh của bài trong một lần gọi (chế độ tự động)
# Mỗi chỗ ảnh AI: prompt tiếng Anh từng thành phần (vật chính, tình trạng, góc máy, ánh sáng…) và
# dòng tóm tắt tiếng Việt; mọi chỗ: alt và chú thích tiếng Việt. AI chỉ đọc chữ (mô tả chỗ ảnh,
# tiêu đề mục, thẻ ảnh), không xem ảnh. Một bài có tới 8 chỗ ảnh nên max_tokens lớn hơn việc alt.
# Luật viết prompt nằm ở mục [image_prompt] của config/content.toml. Không cần web_search.
provider = "gemini"
model = "gemini-3.8-flash"
effort = "low"
max_tokens = 8000

# ---------------------------------------------------------------- chế độ tự động
# Mục [auto] (thiết kế T-141): nhịp gọi AI khi app tự soạn bài («Soạn tự động», «Viết các bài tới
# hạn»). Đây không phải một việc AI nên không có provider, model. Thiếu mục hay thiếu dòng thì
# chế độ tự động dùng 6 giây và 0 (không chặn).
[auto]
# min_seconds_between_calls: hai lần gọi Gemini liền nhau cách nhau ít nhất bấy nhiêu giây. 6 giây
#   là không quá 10 lần mỗi phút, để gói miễn phí ít báo «Gemini đang giới hạn số lần gọi».
min_seconds_between_calls = 6
# gemini_requests_per_day: số lần gọi Gemini tối đa mỗi ngày. Ngày của Google đặt lại lúc nửa đêm
#   giờ Thái Bình Dương: 15:00 giờ Việt Nam từ tuần đầu tháng 11 tới tuần thứ hai của tháng 3,
#   14:00 trong thời gian còn lại. 0 = chưa biết: app không chặn, chỉ đếm số lần đã gọi.
#   Xem số thật của gói đang dùng trong Google AI Studio rồi ghi vào đây. App chỉ đếm lần gọi của
#   máy này; Google tính hạn mức theo project, nên hai máy dùng chung khóa thì dùng chung hạn mức.
gemini_requests_per_day = 0

# ---------------------------------------------------------------- tạo ảnh minh họa (đang tắt)
# Chủ dự án chốt 2026-11-18: ảnh minh họa AI tạo bằng Cloudflare Workers AI, mô hình FLUX.1
# [schnell] (thiết kế T-140), miễn phí trong hạn mức ngày của Cloudflare. Mục dưới đây ĐANG TẮT
# (có dấu # ở đầu dòng). CHỈ BẬT SAU LẦN GỌI THỬ CÙNG CHỦ DỰ ÁN (Chỉ Huy hướng dẫn): khi đó xóa
# dấu # ở 4 dòng [tasks.image], provider, model, steps. Khóa Cloudflare để trong .env, không ghi
# ở file này.
# steps: số bước vẽ của FLUX.1 [schnell], từ 1 tới 8; 4 là mặc định của Cloudflare. effort,
# web_search, max_tokens không dùng cho việc tạo ảnh.
#
# [tasks.image]  # tạo ảnh minh họa từ prompt (ảnh AI luôn ghi rõ là ảnh minh họa)
# provider = "cloudflare"
# model = "@cf/black-forest-labs/flux-1-schnell"
# steps = 4
