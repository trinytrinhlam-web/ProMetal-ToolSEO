# LƯU Ý (T-103, 2026-10-28; nối ở T-102, 2026-10-31): mục [plan] dùng cho bước Xuất bản của Soạn
# bài (Giai đoạn 5). Phần mềm chỉ đọc default_time ở mục này; các nhãn bên dưới chỉ là chú thích.
[plan]
# default_time: giờ đăng mặc định, kiểu 24 giờ HH:MM (ví dụ "08:00", "19:30"), theo múi giờ của
#   app (mặc định giờ Việt Nam). Phần mềm điền sẵn giờ này vào ô Giờ của «Hẹn giờ» khi bài chưa có
#   giờ đăng (bài mở từ dòng kế hoạch có ô «Giờ đăng» thì dùng giờ của dòng đó); bạn vẫn sửa được
#   trước khi gửi. Viết sai dạng (ví dụ "2 giờ chiều", "25:00") thì phần mềm bỏ qua và dùng "08:00".
#   Công tắc cho phép hẹn giờ và đăng ngay hiện mặc định tắt: khi tắt, ô Giờ không hiện và bài chỉ
#   gửi được dạng nháp.
default_time = "08:00"
#
# Nhãn trong kế hoạch: cố định trong phần mềm (cũng là danh sách chọn trên Google Sheets); phần mềm
# không đọc nhãn từ file này. Gõ tay trên Sheet thì dùng đúng các nhãn sau:
#   Ý định (người tìm muốn gì):
#     «Tìm hiểu»: muốn biết nguyên nhân, cách làm, tự sửa được không (cửa kéo bị kẹt ray).
#     «So sánh trước khi mua»: cân nhắc vật liệu, kiểu cửa, sửa hay thay (cửa cuốn hay cửa kéo).
#     «Mua hàng»: đã muốn thuê thợ hay đặt làm (thợ sửa cửa cuốn tại nhà).
#   Loại trang: «Hướng dẫn», «Dịch vụ», «Khu vực», «Công trình thực tế», «Cập nhật bài cũ» (phần
#     mềm chưa sửa được bài đã đăng, nhãn này chỉ để nhớ).
#   Ưu tiên: «Cao», «Trung bình», «Thấp».
#   Trạng thái: «Chưa viết», «Đang viết», «Đã gửi nháp», «Đã hẹn giờ», «Đã đăng», «Bỏ». Ba trạng
#     thái «Đã gửi nháp», «Đã hẹn giờ», «Đã đăng» do phần mềm ghi sau khi gửi bài lên website.

# LƯU Ý (T-040, 2026-10-23; nối ở T-041, 2026-10-26): phần mềm đọc mục [meta] mỗi lần AI gợi ý
# meta, nên sửa ở đây rồi bấm gợi ý lại là có hiệu lực. Lời dặn AI viết meta nằm trong code
# (seo_app/content/prompts.py, hàm meta_prompt) và đã dặn đúng các điều ghi dưới đây.
[meta]
# Meta title là dòng tiêu đề hiện trên trang kết quả Google; meta description là đoạn mô tả ngắn
# bên dưới. AI gợi ý 3 title và 2 description; bạn chọn, sửa rồi mới dùng.
#
# Độ dài (đếm cả dấu cách, chữ có dấu tính là một ký tự). Các ngưỡng này cố định trong code
# (seo_app/onpage/meta.py), không đổi được ở file này:
#   - Title: nên 50–60 ký tự; dưới 30 hoặc trên 65 thì báo «Cảnh báo» (Google cắt bớt khi dài).
#   - Description: nên 120–155 ký tự; dưới 70 hoặc trên 160 thì báo «Cảnh báo».
#   - Gợi ý của AI ngắn hay dài hơn mức «Cảnh báo» bị bỏ luôn, không hiện ra.

# brand_suffix: đuôi thương hiệu gắn sau title, chỉ khi title cộng đuôi không quá 60 ký tự (chủ
#   dự án chốt 2026-10-16, phương án 3A). AI được dặn không tự viết tên thương hiệu vào title.
#   Để "" (rỗng) nếu không muốn gắn đuôi. Dài quá 25 ký tự, có thẻ HTML hay «%%» thì phần mềm bỏ
#   qua và dùng lại " | Pro-Metal".
brand_suffix = " | Pro-Metal"

# avoid: cụm nên tránh trong meta (không phân biệt hoa thường), dùng thêm cho danh sách «banned»
#   ở mục [voice]. Đây là lời khen không kiểm chứng được và lời hối thúc: chiếm chỗ trên Google mà
#   không nói bài giúp được gì. Phần lớn cách nói về giá và chữ «miễn phí» đã bị phần mềm chặn
#   riêng; «giá cả» thì còn lọt nên ghi ở đây. Gợi ý AI có cụm nào dưới đây thì bị bỏ, trừ khi
#   cụm đó nằm trong từ khóa chính (từ khóa «sửa cửa uy tín hcm» vẫn dùng được).
avoid = [
  # Khen không kiểm chứng được
  "uy tín",
  "chuyên nghiệp",
  "hàng đầu",
  "số 1",
  "tốt nhất",
  "chất lượng cao",
  "100%",
  # Hứa điều hồ sơ doanh nghiệp không có (giờ phục vụ là 6h–21h)
  "24/7",
  # Hối thúc
  "gọi ngay",
  "liên hệ ngay",
  "xem ngay",
  "click ngay",
  "đừng bỏ lỡ",
  # Nói về giá
  "giá cả",
]
