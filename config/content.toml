  "Alt ảnh AI bắt đầu bằng «Minh họa» rồi tả vật trong ảnh, ví dụ «Minh họa cấu tạo ray và bánh xe cửa cổng trượt». Chú thích ảnh AI bắt đầu bằng «Ảnh minh họa (AI)»",
