[images]
# Nén ảnh trước khi tải lên web (báo cáo T-046 mục 2, quyết định 5A ngày 2026-10-19).
# webp_quality: chất lượng WebP, 1–100. Số cao thì ảnh nét hơn nhưng nặng hơn. 80 là điểm khởi
#   đầu, nhắm khoảng 150–400 KB mỗi ảnh; thử với ảnh thật rồi chỉnh (ví dụ 75 nếu ảnh quá nặng).
# max_edge_px: cạnh dài nhất của ảnh sau khi thu nhỏ, tính bằng điểm ảnh (px). Ảnh nhỏ hơn
#   giữ nguyên, không phóng to. Bài viết dùng đúng file đầy đủ này (5A) để GPS tới người xem.
webp_quality = 80
max_edge_px = 1600

[alt]
# Quy tắc viết alt (chữ thay thế của ảnh) và chú thích ảnh. AI đọc mục này mỗi lần gợi ý alt;
# bạn vẫn sửa và bấm duyệt từng alt trước khi gửi bài.
# Alt dùng cho người khiếm thị (máy đọc màn hình đọc to) và cho Google hiểu ảnh. Viết như đang
# tả ảnh cho một người không nhìn thấy: ảnh có gì, đang ở tình trạng nào.
max_chars = 125          # alt dài tối đa bao nhiêu ký tự (tính cả dấu cách)
caption_max_chars = 200  # chú thích dưới ảnh dài tối đa bao nhiêu ký tự

