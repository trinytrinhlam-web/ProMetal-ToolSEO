# Cấu hình Streamlit (không chứa bí mật).

[server]
# Chỉ mở app trên chính máy này, máy khác trong mạng không truy cập được.
address = "localhost"
# Không hỏi email ở lần chạy đầu tiên.
showEmailPrompt = false

[browser]
# Không gửi số liệu sử dụng cho Streamlit.
gatherUsageStats = false

[client]
# Ẩn nút "Deploy" và menu dành cho lập trình viên trên thanh công cụ.
toolbarMode = "minimal"

[theme]
# Font tiếng Việt Be Vietnam Pro (tải từ Google Fonts; mất mạng thì dùng font hệ thống).
font = "Be Vietnam Pro:https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "10px"
buttonRadius = "8px"
showWidgetBorder = true
headingFontWeights = [700, 650, 600, 600, 600, 600]

[theme.light]
primaryColor = "#0F7B6C"
backgroundColor = "#FBFBF8"
secondaryBackgroundColor = "#F1F3EE"
textColor = "#1C2421"
borderColor = "#E2E5DE"
linkColor = "#0F7B6C"

[theme.dark]
primaryColor = "#3CC4A8"
backgroundColor = "#131719"
secondaryBackgroundColor = "#1C2225"
textColor = "#E5E9E7"
borderColor = "#2B3336"
linkColor = "#3CC4A8"
