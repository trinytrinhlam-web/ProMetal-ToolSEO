[project]
name = "seo-app"
version = "0.1.0"
description = "Phần mềm hỗ trợ triển khai kế hoạch SEO cho website WordPress"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    # Xác thực tài khoản dịch vụ Google để đọc/ghi Google Sheets (seo_app/google/). Đã cài sẵn
    # nhờ google-genai, ghi tên ra đây vì app dùng trực tiếp (chủ dự án chốt câu 1A 2026-10-28,
    # T-097); giữ đúng bản đã khóa, không nới.
    "google-auth>=2.62.0",
    # Thư viện chính hãng của Gemini và ChatGPT (chủ dự án duyệt 2026-10-14, T-018).
    "google-genai>=2.30.1",
    "openai>=3.31.0",
    # Thư viện ảnh (chủ dự án duyệt 2026-10-16). Streamlit vốn đã cài sẵn, ghi tên vì app dùng
    # trực tiếp ở Giai đoạn 3 (T-047). Bản 13 vá 53 khuyến cáo của 12.3.0 (T-058, chốt 2026-10-20);
    # Streamlit khai báo pillow<13 nên phải ép bằng override-dependencies ở [tool.uv] bên dưới.
    "pillow>=13.0.0",
    # Đọc ảnh HEIC của iPhone, gắn vào Pillow (chủ dự án duyệt 2026-10-19, T-047).
    "pillow-heif>=1.8.1",
    # Khuôn dữ liệu kết quả AI (seo_app/content/models.py). Đã cài sẵn nhờ anthropic, ghi tên
    # ra đây vì app dùng trực tiếp (chủ dự án duyệt 2026-10-14, T-006).
    "pydantic>=2",
    "python-dotenv>=1.0",
    # Gọi WordPress REST API (Streamlit vốn đã cài sẵn thư viện này).
    "requests>=2.31",
    "streamlit>=1.40",
    # Windows không có sẵn dữ liệu múi giờ; thiếu gói này thì zoneinfo báo lỗi.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
# T-058 (chủ dự án chốt 2026-10-20, lựa chọn A): ép Pillow 13 dù Streamlit khai báo pillow<13.
# Quay về bản cũ: xóa dòng này, đổi khai báo trên về "pillow>=12.3", chạy `uv lock` rồi `uv sync`.
override-dependencies = ["pillow>=13.0.0,<14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
