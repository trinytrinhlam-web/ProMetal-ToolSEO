[project]
name = "seo-app"
version = "0.1.0"
description = "Phần mềm hỗ trợ triển khai kế hoạch SEO cho website WordPress"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    # Windows không có sẵn dữ liệu múi giờ; thiếu gói này thì zoneinfo báo lỗi.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
