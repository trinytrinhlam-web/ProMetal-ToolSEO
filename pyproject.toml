[project]
name = "seo-app"
version = "0.1.0"
description = "Phần mềm hỗ trợ triển khai kế hoạch SEO cho website WordPress"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.13.0",
    # Khuôn dữ liệu kết quả AI (seo_app/content/models.py). Đã cài sẵn nhờ anthropic, ghi tên
    # ra đây vì app dùng trực tiếp (chủ dự án duyệt 2026-10-14, T-006).
    "pydantic>=2",
    "python-dotenv>=1.0",
    # Gọi WordPress REST API (Streamlit vốn đã cài sẵn thư viện này).
    "requests>=2.31",
    "streamlit>=1.40",
    # Windows không có sẵn dữ liệu múi giờ; thiếu gói này thì zoneinfo báo lỗi.
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
